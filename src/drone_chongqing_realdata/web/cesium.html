<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>渝中半岛真实数据验证｜Cesium</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>
  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css"
  >
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="cesiumContainer"></div>

  <aside class="panel">
    <header>
      <h1>渝中半岛真实数据验证</h1>
      <p>
        Cesium 推荐模式：Cesium World Terrain与Cesium OSM Buildings。
        建筑位置和轮廓来自OSM，建筑缺失高度由Cesium估计。
      </p>
      <span class="badge">真实地形 + 全球 OSM 三维建筑</span>
    </header>

    <section class="section" id="tokenSection">
      <div class="section-title">Cesium ion 访问令牌</div>
      <form class="token-form" id="tokenForm">
        <input
          id="tokenInput"
          type="password"
          autocomplete="off"
          placeholder="粘贴本机使用的 Cesium ion 访问令牌"
        >
        <button type="submit">加载真实三维场景</button>
      </form>
      <p class="small">
        令牌只保存在当前浏览器 localStorage中，不会写入ROS工程文件。
      </p>
    </section>

    <section class="section">
      <div class="section-title">视角</div>
      <div class="button-grid" id="cesiumViewButtons"></div>
    </section>

    <section class="section">
      <div class="section-title">场景控制</div>
      <div class="control-row">
        <label for="cesiumTerrainScale">地形垂直系数</label>
        <input
          id="cesiumTerrainScale"
          type="range"
          min="1"
          max="2"
          value="1"
          step="0.05"
        >
        <span id="cesiumTerrainValue">1.00</span>
      </div>
      <div class="button-grid">
        <button id="toggleCesiumBuildings">建筑</button>
        <button id="toggleCesiumLabels">地标</button>
        <a class="button-link" href="./index.html">
          MapLibre 模式
        </a>
        <button id="clearToken">清除令牌</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">状态</div>
      <div id="cesiumStatus" class="status warn">
        请粘贴Cesium ion 访问令牌。
      </div>
    </section>
  </aside>

  <script src="./cesium_app.js"></script>
</body>
</html>
